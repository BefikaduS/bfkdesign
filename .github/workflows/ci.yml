name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the app boots
        run: |
          node -e "const { spawn } = require('child_process'); const p = spawn('node', ['server.js'], { stdio: 'inherit' }); setTimeout(() => p.kill('SIGTERM'), 2000); p.on('exit', (code, signal) => { if (signal === 'SIGTERM' || code === 0) process.exit(0); process.exit(code || 1); });"
